<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drew's Wii Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- LOADING SCREEN -->
  <div id="loadingScreen">
    <div class="loading-glow"></div>

    <div class="loading-content">
      <div class="wii-logo">DREW'S</div>
      <div class="portfolio-text">PORTFOLIO</div>

      <div class="loading-bar">
        <div class="loading-fill"></div>
      </div>

      <div class="loading-text">Loading Channels...</div>

      <div class="loading-dots">
        <span class="active"></span>
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  </div>

  <!-- MAIN MENU -->
  <div class="wii-menu" id="mainMenu">

    <div class="top-dots">
      <span class="active"></span><span></span><span></span><span></span><span></span>
    </div>

    <div class="settings-btn" data-page="settings">★</div>
    <div class="mute-btn" id="muteBtn">🔊</div>

    <div class="page-arrow">▶</div>

    <div class="channel-grid">

      <div id="aboutChannel" class="channel selected about-me-channel" data-page="about">
        <img src="imgs/Screenshot 2026-05-08 091402.png">
      </div>

      <div id="projectsChannel" class="channel" data-page="projects">
        PROJECTS
      </div>

      <div class="channel" data-page="contact">CONTACT</div>
      <div class="channel" data-page="skills">SKILLS</div>
      <div class="channel" data-page="resume">RESUME</div>
      <div class="channel" data-page="future">FUTURE</div>

      <div class="channel empty"></div>
      <div class="channel empty"></div>
      <div class="channel empty"></div>
      <div class="channel empty"></div>
      <div class="channel empty"></div>
      <div class="channel empty"></div>
      <div class="channel empty"></div>

    </div>

    <div class="wave-bottom"></div>

    <div class="bottom-bar">
      <div class="remote-btn">🎮</div>

      <div class="bottom-center">
        <div class="time">12:00 <span class="ampm">AM</span></div>
        <div class="date">Fri 1/1</div>
      </div>

      <a class="envelope"
        href="https://mail.google.com/mail/?view=cm&fs=1&to=lichtenthaldrew@gmail.com&su=Hello%20Drew&body=Hey%20Drew!"
        target="_blank">✉</a>
    </div>
  </div>

  <!-- ABOUT -->
  <div class="sub-page" id="aboutPage">
    <div class="sub-header">
      <a class="back-btn" href="#" onclick="closeSubPage();return false;">◀</a>
      <div class="sub-title">ABOUT ME</div>
    </div>

    <div class="about-content" id="aboutContentContainer"></div>
  </div>

  <!-- ABOUT TEXT -->
  <div class="sub-page" id="aboutTextPage">
    <div class="sub-header">
      <a class="back-btn" href="#" onclick="closeSubPage();return false;">◀</a>
      <div class="sub-title">ABOUT ME</div>
    </div>

    <div class="about-text-content">
      <h1>Drew Lichtenthal</h1>
      <p>Senior at Marlboro High School.</p>
      <p>Goalie, web designer, creative developer.</p>
      <p>Inspired by Wii-style UI design.</p>
    </div>
  </div>

  <!-- PROJECTS -->
  <div class="sub-page" id="projectsPage">

    <div class="sub-header">
      <a class="back-btn" href="#" onclick="closeSubPage();return false;">◀</a>
      <div class="sub-title">PROJECTS</div>
    </div>

    <div class="project-tabs" id="projectTabs"></div>
    <div class="projects-grid" id="projectsGrid"></div>
  </div>

  <div class="sub-page" id="pageViewer">
    <div class="sub-header">
      <a class="back-btn" href="#" onclick="closeSubPage();return false;">◀</a>
      <div class="sub-title" id="pageViewerTitle"></div>
    </div>
    <div class="page-view-content" id="pageViewerContent"></div>
  </div>

  <!-- PROJECT VIEWER -->
  <div class="sub-page" id="projectViewer">
    <div class="sub-header">
      <a class="back-btn" href="#" onclick="closeSubPage();return false;">◀</a>
      <div class="sub-title" id="projectViewerTitle"></div>
      <a id="visitProjectBtn" class="visit-btn" href="#" target="_blank">VISIT SITE ↗</a>
    </div>
    <div class="project-viewer-content">
      <iframe id="projectIframe" title="Project Preview"></iframe>
    </div>
  </div>

  <div id="musicContainer">
    <iframe id="musicFrame" title="Wii Home Music Player" width="560" height="315" frameborder="0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
  </div>

  <script src="script.js"></script>
</body>

</html>
