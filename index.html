<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Wii Menu</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="wii-menu">

  <!-- top dots -->
  <div class="top-dots">
    <span class="active"></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
  </div>

  <!-- settings -->
  <div class="settings-btn">
    ⚙
  </div>

  <!-- arrow -->
  <div class="page-arrow">
    ▶
  </div>

  <!-- grid -->
  <div class="channel-grid">

    <div class="channel selected">
      <img src="https://i.imgur.com/Ag6SOlL.png">
    </div>

    <div class="channel">
      💿
    </div>

    <div class="channel">
      👨‍👩‍👧
    </div>

    <div class="channel">
      🔧
    </div>

    <div class="channel">
      💬
    </div>

    <div class="channel">
      Wii
    </div>

    <div class="channel">
      📊
    </div>

    <div class="channel">
      ♿
    </div>

    <div class="channel">
      ⚠
    </div>

    <div class="channel empty"></div>

    <div class="channel empty"></div>

    <div class="channel empty"></div>

    <div class="channel empty"></div>

    <div class="channel empty"></div>

    <div class="channel empty"></div>

    <div class="channel empty"></div>

    <div class="channel empty"></div>

    <div class="channel empty"></div>

  </div>

  <!-- bottom nav -->
  <div class="bottom-bar">

    <div class="bottom-icon orange">☺</div>

    <div class="bottom-icon green">👨‍👩‍👧</div>

    <div class="bottom-icon yellow">🛍</div>

    <div class="bottom-icon blue">🌐</div>

    <div class="bottom-icon cyan">💬</div>

    <div class="bottom-icon blue2">👍</div>

  </div>

</div>

<script src="script.js"></script>

</body>
</html>
