<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Wii Menu</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="wii-menu">

  <!-- TOP DOTS -->

  <div class="top-dots">
    <span class="active"></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
  </div>

  <!-- SETTINGS -->

  <div class="settings-btn">
    ⚙
  </div>

  <!-- MUTE -->

  <div class="mute-btn" id="muteBtn">
    🔊
  </div>

  <!-- ARROW -->

  <div class="page-arrow">
    ▶
  </div>

  <!-- CHANNEL GRID -->

  <div class="channel-grid">

    <div class="channel selected">
      <img src="https://img.youtube.com/vi/5-E_0uhPzaE/maxresdefault.jpg">
    </div>

    <div class="channel">💿</div>

    <div class="channel">👨‍👩‍👧</div>

    <div class="channel">🔧</div>

    <div class="channel">💬</div>

    <div class="channel">Wii</div>

    <div class="channel">📊</div>

    <div class="channel">♿</div>

    <div class="channel">⚠</div>

    <div class="channel empty"></div>
    <div class="channel empty"></div>
    <div class="channel empty"></div>
    <div class="channel empty"></div>
    <div class="channel empty"></div>
    <div class="channel empty"></div>
    <div class="channel empty"></div>
    <div class="channel empty"></div>
    <div class="channel empty"></div>

  </div>

  <!-- BOTTOM GLOW -->

  <div class="wave-bottom"></div>

  <!-- BOTTOM BAR -->

  <div class="bottom-bar">

    <div class="bottom-left">

      <div class="remote-btn">
        🎮
      </div>

    </div>

    <div class="bottom-center">

      <div class="time">
        12:00 <span class="ampm">AM</span>
      </div>

      <div class="date">
        Fri 1/1
      </div>

    </div>

    <div class="bottom-right">

      <div class="envelope">
        ✉
      </div>

    </div>

  </div>

  <!-- HIDDEN WII MUSIC -->

  <div id="musicContainer">

    <iframe
      src="https://www.youtube.com/embed/5-E_0uhPzaE?autoplay=1&loop=1&playlist=5-E_0uhPzaE"
      title="Wii Music"
      frameborder="0"
      allow="autoplay"
      allowfullscreen>
    </iframe>

  </div>

</div>

<script src="script.js"></script>

</body>
</html>
