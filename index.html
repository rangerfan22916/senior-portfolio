<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Drew's Wii Portfolio</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

<!-- =========================
     LOADING SCREEN
========================= -->

<div id="loadingScreen">

  <div class="loading-glow"></div>

  <div class="loading-content">

    <div class="wii-logo">
      DREW'S
    </div>

    <div class="portfolio-text">
      PORTFOLIO
    </div>

    <div class="loading-bar">

      <div class="loading-fill"></div>

    </div>

    <div class="loading-text">
      Loading Channels...
    </div>

    <div class="loading-dots">

      <span class="active"></span>
      <span></span>
      <span></span>
      <span></span>

    </div>

  </div>

</div>

<!-- =========================
     MAIN WII MENU
========================= -->

<div class="wii-menu">

  <!-- TOP DOTS -->

  <div class="top-dots">
    <span class="active"></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
  </div>

  <!-- SETTINGS -->

  <div class="settings-btn">
    ⚙
  </div>

  <!-- MUTE -->

  <div class="mute-btn" id="muteBtn">
    🔊
  </div>

  <!-- ARROW -->

  <div class="page-arrow">
    ▶
  </div>

  <!-- CHANNEL GRID -->

  <div class="channel-grid">

    <div class="channel selected">
      <img src="https://img.youtube.com/vi/5-E_0uhPzaE/maxresdefault.jpg">
    </div>

    <div class="channel">
      ABOUT ME
    </div>

    <div class="channel">
      PROJECTS
    </div>

    <div class="channel">
      CONTACT
    </div>

    <div class="channel">
      SKILLS
    </div>

    <div class="channel">
      RESUME
    </div>

    <div class="channel">
      GITHUB
    </div>

    <div class="channel">
      MEDIA
    </div>

    <div class="channel">
      FUTURE
    </div>

    <div class="channel empty"></div>
    <div class="channel empty"></div>
    <div class="channel empty"></div>
    <div class="channel empty"></div>
    <div class="channel empty"></div>
    <div class="channel empty"></div>
    <div class="channel empty"></div>
    <div class="channel empty"></div>
    <div class="channel empty"></div>

  </div>

  <!-- BOTTOM GLOW -->

  <div class="wave-bottom"></div>

  <!-- BOTTOM BAR -->

  <div class="bottom-bar">

    <div class="bottom-left">

      <div class="remote-btn">
        🎮
      </div>

    </div>

    <div class="bottom-center">

      <div class="time">
        12:00 <span class="ampm">AM</span>
      </div>

      <div class="date">
        Fri 1/1
      </div>

    </div>

    <div class="bottom-right">

      <div class="envelope">
        ✉
      </div>

    </div>

  </div>

  <!-- MUSIC -->

  <div id="musicContainer">

    <iframe
      src=""
      title="Wii Music"
      frameborder="0"
      allow="autoplay"
      allowfullscreen>
    </iframe>

  </div>

</div>

<script src="script.js"></script>

</body>
</html>
